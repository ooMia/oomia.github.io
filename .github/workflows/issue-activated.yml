name: Issue orchestration

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      action:
        description: Admission replay or explicit Development start
        required: true
        default: admit
        type: choice
        options:
          - admit
          - start
      issue_number:
        description: Existing Issue number
        required: true
        type: number

concurrency:
  group: issue-activation-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  project:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       !startsWith(github.event.issue.title, 'draft:')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: ooMia/oomia.github.io.knowledge/.github/workflows/project-admission.yml@0f21e830e86f60f24415e8f6a2a07faaa305c466
    with:
      issue_number: ${{ github.event.issue.number || inputs.issue_number }}
      initial_event: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
    secrets:
      project_token: ${{ secrets.PROJECT_TOKEN }}

  development:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'start'
    needs: project
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Start linked Development work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ooMia
          PROJECT_NUMBER: "11"
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node .github/scripts/create-development-branch.mjs
