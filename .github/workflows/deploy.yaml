name: Publish Site
run-name: Publish Site from ${{ github.event_name }} (Docs ${{ inputs.docs_revision || 'latest prepared main' }})
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docs_revision:
        description: Expected consumable Docs main SHA (empty resolves current main)
        type: string
        required: false
        default: ""
permissions:
  contents: read
# Serialize selection, build and delivery together to prevent older builds
# overwriting a newer delivery. Pending runs may be coalesced by GitHub.
concurrency:
  group: pages
  cancel-in-progress: false
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
  DOCS_CHECKOUT_MODE: resolved
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Checkout exact canonical Site revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup publication selector runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Resolve immutable Docs snapshot and skip stale or duplicate requests
        id: publication
        env:
          DOCS_READ_TOKEN: ${{ secrets.PRIVATES_GITHUB_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_DOCS_REVISION: ${{ inputs.docs_revision }}
        run: node .github/scripts/publication.mjs select
      - name: Checkout resolved Docs production snapshot
        if: steps.publication.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: ooMia/oomia.github.io.docs
          ref: ${{ steps.publication.outputs.docs_revision }}
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          path: apps/web/data/articles
          fetch-depth: 0
      - name: Record content revisions
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        run: bash .github/scripts/record-content-revisions.sh
      - uses: withastro/action@v6
        if: steps.publication.outputs.publish == 'true'
        with:
          cache: false
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
      - name: Verify built article social URLs
        if: steps.publication.outputs.publish == 'true'
        run: node apps/web/tests/verify-article-social.mjs
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
