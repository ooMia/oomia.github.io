name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - uses: withastro/action@v6
        with:
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

  promotion:
    name: Promotion validation
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - name: Use isolated pnpm store
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp run -r build

  cache-benchmark:
    name: Cache benchmark (${{ matrix.variant }})
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [manual, builtin-explicit, builtin-auto]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm without cache
        if: matrix.variant == 'manual'
        uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - name: Use isolated pnpm store
        if: matrix.variant == 'manual'
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-benchmark-store"

      - name: Restore manual pnpm store
        if: matrix.variant == 'manual'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-benchmark-store
          key: pnpm-benchmark-manual-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-benchmark-manual-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-

      - name: Setup pnpm with builtin cache
        if: matrix.variant == 'builtin-explicit'
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false
          require-lockfile: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm with builtin cache and install
        if: matrix.variant == 'builtin-auto'
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: matrix.variant != 'builtin-auto'
        run: pnpm install --frozen-lockfile

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
