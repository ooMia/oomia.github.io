name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - uses: withastro/action@v6
        with:
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

  promotion:
    name: Promotion validation
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - name: Inspect shallow checkout topology
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          site_shallow="$(git rev-parse --is-shallow-repository)"
          docs_shallow="$(git -C "$docs" rev-parse --is-shallow-repository)"
          docs_head="$(git -C "$docs" rev-parse HEAD)"

          echo "SITE_SHALLOW_BEFORE=$site_shallow" >> "$GITHUB_ENV"
          echo "DOCS_SHALLOW_BEFORE=$docs_shallow" >> "$GITHUB_ENV"
          echo "DOCS_HEAD_BEFORE=$docs_head" >> "$GITHUB_ENV"

          test "$site_shallow" = "true"
          test "$docs_shallow" = "true"

          echo "site_shallow_before=$site_shallow"
          echo "docs_shallow_before=$docs_shallow"
          echo "docs_head_before=$docs_head"

          {
            echo "## Docs history experiment"
            echo
            echo "- Site shallow before: $site_shallow"
            echo "- Docs shallow before: $docs_shallow"
            echo "- Docs HEAD before: $docs_head"
            echo
            echo "### Docs object store before"
            echo '~~~text'
            git -C "$docs" count-objects -vH
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch full history for pinned Docs submodule only
        shell: bash
        run: |
          set -euo pipefail
          git -C apps/web/data/articles fetch --unshallow --no-tags origin

      - name: Verify Docs history without moving the pinned revision
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          site_shallow="$(git rev-parse --is-shallow-repository)"
          docs_shallow="$(git -C "$docs" rev-parse --is-shallow-repository)"
          docs_head="$(git -C "$docs" rev-parse HEAD)"

          test "$site_shallow" = "true"
          test "$docs_shallow" = "false"
          test "$docs_head" = "$DOCS_HEAD_BEFORE"

          {
            echo "- Site shallow after: `$site_shallow`"
            echo "- Docs shallow after: `$docs_shallow`"
            echo "- Docs HEAD after: `$docs_head`"
            echo
            echo "### Representative article history"

            for file in               content/articles/tech/java/Pattern.md               content/articles/tech/log/woowa-precourse-utility.mdx
            do
              newest="$(git -C "$docs" log --follow --no-merges -1 --format=%aI -- "$file")"
              oldest="$(git -C "$docs" log --follow --no-merges --format=%aI -- "$file" | tail -n 1)"
              count="$(git -C "$docs" log --follow --no-merges --format=%H -- "$file" | wc -l | tr -d ' ')"

              test -n "$newest"
              test -n "$oldest"

              echo "- `$file`: revisions=`$count`, first=`$oldest`, last=`$newest`"
            done

            echo
            echo "### Rename/history-follow sample"
            echo '~~~text'
            git -C "$docs" log               --follow               --no-merges               --name-status               --format='commit %H %aI %s'               -- content/articles/tech/java/Pattern.md
            echo '~~~'
            echo
            echo "### Docs object store after"
            echo '~~~text'
            git -C "$docs" count-objects -vH
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Docs history evidence
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          evidence="docs-history-evidence.txt"

          site_shallow="$(git rev-parse --is-shallow-repository)"
          docs_shallow="$(git -C "$docs" rev-parse --is-shallow-repository)"
          docs_head_after="$(git -C "$docs" rev-parse HEAD)"

          test "$site_shallow" = "true"
          test "$docs_shallow" = "false"
          test "$docs_head_after" = "$DOCS_HEAD_BEFORE"

          {
            echo "site_shallow=$site_shallow"
            echo "docs_shallow=$docs_shallow"
            echo "docs_head_before=$DOCS_HEAD_BEFORE"
            echo "docs_head_after=$docs_head_after"
            echo
            echo "[docs_object_store]"
            git -C "$docs" count-objects -vH
            echo
            echo "[article_history]"

            for file in \
              content/articles/tech/java/Pattern.md \
              content/articles/tech/log/woowa-precourse-utility.mdx
            do
              newest="$(git -C "$docs" log --follow --no-merges -1 --format=%aI -- "$file")"
              oldest="$(git -C "$docs" log --follow --no-merges --format=%aI -- "$file" | tail -n 1)"
              count="$(git -C "$docs" log --follow --no-merges --format=%H -- "$file" | wc -l | tr -d ' ')"

              test -n "$newest"
              test -n "$oldest"

              echo "file=$file"
              echo "revisions=$count"
              echo "first_author_date=$oldest"
              echo "last_author_date=$newest"
              echo
            done

            echo "[pattern_follow_history]"
            git -C "$docs" log \
              --follow \
              --no-merges \
              --name-status \
              --format='commit=%H author_date=%aI subject=%s' \
              -- content/articles/tech/java/Pattern.md
          } > "$evidence"

          cat "$evidence"

      - name: Upload Docs history evidence
        uses: actions/upload-artifact@v4
        with:
          name: docs-history-evidence
          path: docs-history-evidence.txt
          if-no-files-found: error
          retention-days: 14

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - name: Use isolated pnpm store
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web sync
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp run -r build

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
