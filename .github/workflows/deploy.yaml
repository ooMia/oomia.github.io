name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - name: Expand pinned Docs history
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          docs_head="$(git -C "$docs" rev-parse HEAD)"

          test "$(git rev-parse --is-shallow-repository)" = "true"

          if [ "$(git -C "$docs" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$docs" fetch --unshallow --no-tags origin
          fi

          test "$(git -C "$docs" rev-parse --is-shallow-repository)" = "false"
          test "$(git -C "$docs" rev-parse HEAD)" = "$docs_head"

      - uses: withastro/action@v6
        with:
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

  promotion:
    name: Promotion validation
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - name: Expand pinned Docs history
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          docs_head="$(git -C "$docs" rev-parse HEAD)"

          test "$(git rev-parse --is-shallow-repository)" = "true"

          if [ "$(git -C "$docs" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$docs" fetch --unshallow --no-tags origin
          fi

          test "$(git -C "$docs" rev-parse --is-shallow-repository)" = "false"
          test "$(git -C "$docs" rev-parse HEAD)" = "$docs_head"

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - name: Use isolated pnpm store
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web sync
      - name: Capture formatter output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vp check --fix
          git diff -- \
            apps/web/src/components/presentation/ArticleFrame.tsx \
            apps/web/src/lib/content/article-history.test.ts \
            apps/web/src/lib/content/article-history.ts \
            apps/web/src/lib/content/article-metadata.test.ts \
            apps/web/src/lib/content/article-metadata.ts \
            apps/web/src/lib/content/article-policy.test.ts \
            apps/web/src/lib/content/article-policy.ts \
            apps/web/src/pages/index.astro
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp run -r build

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
