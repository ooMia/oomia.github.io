name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - uses: withastro/action@v6
        with:
          package-manager: pnpm
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
