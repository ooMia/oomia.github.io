name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

jobs:
  build:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout canonical main release revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: Record production release revision
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "Release-SHA=$release_sha"
          {
            echo "## Production release"
            echo
            echo "- Site revision: `$release_sha`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Expand pinned Docs history
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          docs_head="$(git -C "$docs" rev-parse HEAD)"

          test "$(git rev-parse --is-shallow-repository)" = "true"

          if [ "$(git -C "$docs" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$docs" fetch --unshallow --no-tags origin
          fi

          test "$(git -C "$docs" rev-parse --is-shallow-repository)" = "false"
          test "$(git -C "$docs" rev-parse HEAD)" = "$docs_head"

      - uses: withastro/action@v6
        with:
          cache: false
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

      - name: Verify built article social URLs
        run: node apps/web/tests/verify-article-social.mjs

  promotion:
    name: Promotion validation
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: Expand pinned Docs history
        shell: bash
        run: |
          set -euo pipefail
          docs="apps/web/data/articles"
          docs_head="$(git -C "$docs" rev-parse HEAD)"

          test "$(git rev-parse --is-shallow-repository)" = "true"

          if [ "$(git -C "$docs" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$docs" fetch --unshallow --no-tags origin
          fi

          test "$(git -C "$docs" rev-parse --is-shallow-repository)" = "false"
          test "$(git -C "$docs" rev-parse HEAD)" = "$docs_head"

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - name: Use isolated pnpm store
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web sync
      - run: pnpm exec vp check --no-fmt
      - run: pnpm exec vp test
      # The root build script owns workspace orchestration; recursive execution
      # would start both turbo and web builds against the same output directory.
      - run: pnpm exec vp run build
      - name: Verify built article social URLs
        run: node apps/web/tests/verify-article-social.mjs

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
