name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

jobs:
  build:
    env:
      DOCS_CHECKOUT_MODE: ${{ github.event_name == 'pull_request' && 'main' || 'resolved' }}
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest Docs main once for production
        if: github.event_name == 'workflow_dispatch'
        id: docs
        env:
          GH_TOKEN: ${{ secrets.PRIVATES_GITHUB_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          docs_sha="$(gh api repos/ooMia/oomia.github.io.docs/git/ref/heads/main --jq '.object.sha')"
          [[ "$docs_sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\n' "$docs_sha" >> "$GITHUB_OUTPUT"
          printf 'DOCS_CHECKOUT_REVISION=%s\n' "$docs_sha" >> "$GITHUB_ENV"

      - name: Checkout pull request revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          fetch-depth: 1

      - name: Checkout canonical main release revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          fetch-depth: 1

      - name: Checkout current Docs main for PR validation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ooMia/oomia.github.io.docs
          ref: main
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          path: apps/web/data/articles
          fetch-depth: 0

      - name: Checkout resolved Docs production snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          repository: ooMia/oomia.github.io.docs
          ref: ${{ steps.docs.outputs.sha }}
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          path: apps/web/data/articles
          fetch-depth: 0

      - name: Record content revisions
        shell: bash
        run: bash .github/scripts/record-content-revisions.sh

      - uses: withastro/action@v6
        with:
          cache: false
          cache-dir: apps/web/node_modules/.astro
          out-dir: apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oomia.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

      - name: Verify built article social URLs
        run: node apps/web/tests/verify-article-social.mjs

  promotion:
    name: Promotion validation
    env:
      DOCS_CHECKOUT_MODE: main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          fetch-depth: 1

      - name: Checkout current Docs main for PR validation
        uses: actions/checkout@v7
        with:
          repository: ooMia/oomia.github.io.docs
          ref: main
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          path: apps/web/data/articles
          fetch-depth: 0

      - name: Record content revisions
        shell: bash
        run: bash .github/scripts/record-content-revisions.sh

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - name: Use isolated pnpm store
        run: pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-pnpm12-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web sync
      - run: pnpm exec vp check --no-fmt
      - run: pnpm exec vp test
      - name: Verify immutable Docs rendering and fallback offline
        run: pnpm --filter web test:docs-snapshot
      # The root build script owns workspace orchestration; recursive execution
      # would start both turbo and web builds against the same output directory.
      - run: pnpm exec vp run build
      - name: Verify built article social URLs
        run: node apps/web/tests/verify-article-social.mjs

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
