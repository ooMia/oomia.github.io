name: Format Site #46 LinkCard source

on:
  push:
    branches: [46-feat-linkcard-derived-manifest]
    paths:
      - .github/workflows/format-site-46-source.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 46-feat-linkcard-derived-manifest
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp fmt apps/web/src/lib/content/link-card.ts --write

      - name: Emit formatted source
        run: |
          echo "__FORMATTED_LINK_CARD_BEGIN__"
          cat apps/web/src/lib/content/link-card.ts
          echo "__FORMATTED_LINK_CARD_END__"
