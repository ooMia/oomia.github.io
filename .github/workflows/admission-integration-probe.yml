name: Admission integration probe

on:
  pull_request:
    paths:
      - ".github/workflows/admission-integration-probe.yml"

permissions:
  contents: read
  issues: write

jobs:
  replay:
    uses: ooMia/oomia.github.io.knowledge/.github/workflows/project-admission.yml@0f21e830e86f60f24415e8f6a2a07faaa305c466
    with:
      issue_number: 56
      initial_event: false
    secrets:
      project_token: ${{ secrets.PROJECT_TOKEN }}
