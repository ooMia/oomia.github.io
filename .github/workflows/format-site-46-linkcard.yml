name: Format Site #46 LinkCard adapter

on:
  push:
    branches: [46-feat-linkcard-derived-manifest]
    paths:
      - .github/workflows/format-site-46-linkcard.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 46-feat-linkcard-derived-manifest
          token: ${{ secrets.PRIVATES_GITHUB_PAT }}
          submodules: recursive

      - uses: pnpm/setup@v3
        with:
          cache: false
          install: false
          require-lockfile: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check --fix

      - name: Commit formatter output
        shell: bash
        run: |
          git add --             apps/web/src/lib/content/link-card.ts             apps/web/src/lib/content/link-card.test.ts
          if git diff --cached --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Docs-derived LinkCard adapter"
          git push origin HEAD:46-feat-linkcard-derived-manifest
